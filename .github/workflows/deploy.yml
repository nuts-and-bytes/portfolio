name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 单一官方流水线：构建产物由 actions/deploy-pages 直接发布，
# 不再经 gh-pages 分支中转，避免 peaceiris + 原生 CDN 双机制冲突。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署，排队而非取消，保证发布顺序
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
