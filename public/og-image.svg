<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="sphere" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#ffbb00"/>
      <stop offset="78%" stop-color="#3a2bff"/>
      <stop offset="100%" stop-color="#0700ff"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbb00"/>
      <stop offset="1" stop-color="#0700ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#fbfbfc"/>
  <circle cx="960" cy="300" r="250" fill="url(#sphere)" filter="url(#soft)" opacity="0.92"/>
  <circle cx="960" cy="300" r="250" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

  <text x="90" y="196" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" fill="#8a8a92" letter-spacing="8">PORTFOLIO</text>
  <text x="86" y="300" font-family="Georgia,'Times New Roman',serif" font-size="104" font-weight="700" fill="#111114" letter-spacing="-2">Eric Lu</text>
  <text x="90" y="372" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="40" font-weight="600" fill="#2a2a30" letter-spacing="6">朱鑫垚</text>
  <rect x="92" y="410" width="120" height="4" rx="2" fill="url(#rule)"/>
  <text x="90" y="470" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="30" font-weight="500" fill="#55555e">产品运营 &amp; AI 工具应用作品集</text>
  <text x="90" y="516" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#9a9aa2">非科班出身，用 AI 工具把想法做成产品</text>
</svg>
